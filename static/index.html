<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek 流式对话练习</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1a1d26;
    --line: #2a2f3c;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #4a7dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header span { color: var(--muted); font-size: 12px; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .body {
    max-width: min(760px, 82%);
    padding: 10px 14px;
    border-radius: 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .user .body { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .assistant .body { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .err .body { background: #3a1d22; border: 1px solid #6b2b35; color: #ffb4bf; }
  form {
    display: flex;
    gap: 10px;
    padding: 14px 20px 18px;
    border-top: 1px solid var(--line);
    background: var(--bg);
  }
  textarea {
    flex: 1;
    resize: none;
    height: 52px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font: inherit;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button {
    width: 88px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  #status { padding: 0 20px 12px; color: var(--muted); font-size: 12px; min-height: 18px; }
</style>
</head>
<body>
  <header>
    <h1>DeepSeek 流式对话</h1>
    <span>POST /chat → text/event-stream</span>
  </header>

  <main id="log"></main>

  <form id="form">
    <textarea id="input" placeholder="输入内容，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send" type="submit">发送</button>
  </form>
  <div id="status"></div>

<script>
const logEl = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');

// 历史由浏览器保存。服务端是无状态的，每次把整段历史发过去——
// 这就是第 3 步学到的那件事，换到 Web 上一样成立。
const history = [];

function addBubble(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text || '';
  wrap.appendChild(body);
  logEl.appendChild(wrap);
  logEl.scrollTop = logEl.scrollHeight;
  return body;
}

function setStatus(text) {
  statusEl.textContent = text || '';
}

async function send(text) {
  const userBody = addBubble('user', text);
  history.push({ role: 'user', content: text });

  const replyBody = addBubble('assistant', '');
  const cursor = document.createElement('span');
  cursor.textContent = '▍';
  replyBody.appendChild(cursor);

  sendBtn.disabled = true;
  input.disabled = true;
  setStatus('正在生成…');

  const started = performance.now();
  let answer = '';
  let usage = null;

  try {
    const response = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });

    if (!response.ok) {
      const detail = await response.text();
      throw new Error('HTTP ' + response.status + '：' + detail.slice(0, 200));
    }

    // 关键：response.body 是一个可读流，读一块就能渲染一块
    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      // SSE 以空行分隔事件；最后一段可能不完整，留在 buffer 里等下次
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;

        const event = JSON.parse(payload);
        if (event.delta) {
          answer += event.delta;
          replyBody.textContent = answer;
          replyBody.appendChild(cursor);
          logEl.scrollTop = logEl.scrollHeight;
        } else if (event.usage) {
          usage = event.usage;
        } else if (event.error) {
          throw new Error(event.error);
        }
      }
    }

    cursor.remove();
    if (!answer) replyBody.textContent = '（没有收到内容）';

    history.push({ role: 'assistant', content: answer });

    const seconds = ((performance.now() - started) / 1000).toFixed(2);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = usage
      ? '用时 ' + seconds + 's · 输入 ' + usage.in + ' / 输出 ' + usage.out + ' tokens'
      : '用时 ' + seconds + 's';
    replyBody.parentElement.appendChild(meta);
    setStatus('');
  } catch (err) {
    cursor.remove();
    const wrap = document.createElement('div');
    wrap.className = 'msg err';
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = '出错了：' + err.message;
    wrap.appendChild(body);
    logEl.appendChild(wrap);
    setStatus('请求失败，看上面的红框');
    // 失败就把这轮用户消息撤掉，避免历史里留下没有回答的问题
    history.pop();
  } finally {
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send(text);
});

input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

addBubble('assistant', '你好，我是这个练习里的后端。说点什么试试。');
input.focus();
</script>
</body>
</html>
